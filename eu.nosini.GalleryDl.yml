id: eu.nosini.GalleryDl
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: gallery-dl
# Optional features, each exported as its own runtime and only installed on
# request. The extension refs share the app's branch, which CI sets to stable.
add-extensions:
  eu.nosini.GalleryDl.YtDlp:
    directory: extensions/yt-dlp
    bundle: true
    no-autodownload: true
    autodelete: true
  eu.nosini.GalleryDl.PySocks:
    directory: extensions/pysocks
    bundle: true
    no-autodownload: true
    autodelete: true
  eu.nosini.GalleryDl.Brotli:
    directory: extensions/brotli
    bundle: true
    no-autodownload: true
    autodelete: true
  eu.nosini.GalleryDl.PyYAML:
    directory: extensions/pyyaml
    bundle: true
    no-autodownload: true
    autodelete: true
  eu.nosini.GalleryDl.SecretStorage:
    directory: extensions/secretstorage
    bundle: true
    no-autodownload: true
    autodelete: true
  eu.nosini.GalleryDl.Psycopg:
    directory: extensions/psycopg
    bundle: true
    no-autodownload: true
    autodelete: true
  eu.nosini.GalleryDl.Truststore:
    directory: extensions/truststore
    bundle: true
    no-autodownload: true
    autodelete: true
  eu.nosini.GalleryDl.Jinja:
    directory: extensions/jinja
    bundle: true
    no-autodownload: true
    autodelete: true
  eu.nosini.GalleryDl.MkvMerge:
    directory: extensions/mkvmerge
    bundle: true
    no-autodownload: true
    autodelete: true
finish-args:
  # Downloads from the sites gallery-dl supports.
  - --share=network
  # Same configuration folder as a regular install. Flatpak also mounts it
  # under the app's own XDG_CONFIG_HOME, where gallery-dl looks for it.
  - --filesystem=xdg-config/gallery-dl:create
  # The legacy configuration file that gallery-dl also reads.
  - --filesystem=~/.gallery-dl.conf:ro
  # Python's webbrowser only tries xdg-open when a display socket is present;
  # point it there directly so the oauth: extractors open the host browser
  # through the portal.
  - --env=BROWSER=xdg-open
  # Python packages and programs of the add-ons, wherever they are installed.
  - --env=PYTHONPATH=/app/extensions/yt-dlp/lib/python3.14/site-packages:/app/extensions/pysocks/lib/python3.14/site-packages:/app/extensions/brotli/lib/python3.14/site-packages:/app/extensions/pyyaml/lib/python3.14/site-packages:/app/extensions/secretstorage/lib/python3.14/site-packages:/app/extensions/psycopg/lib/python3.14/site-packages:/app/extensions/truststore/lib/python3.14/site-packages:/app/extensions/jinja/lib/python3.14/site-packages
  - --env=PATH=/app/extensions/yt-dlp/bin:/app/extensions/mkvmerge/bin:/app/extensions/secretstorage/bin:/app/bin:/usr/bin
cleanup:
  - /include
  - /lib/pkgconfig
  - '*.a'
  - '*.la'
build-options:
  # Native code only comes from prebuilt wheels and the mkvmerge AppImage, so
  # a .Debug extension would contain nothing useful.
  no-debuginfo: true
modules:
  # Pinned Python dependencies, generated by scripts/generate-python-deps.py.
  - python3-requirements.json

  # Replace pip's gallery-dl script with a launcher that runs through a copy of
  # the runtime's Python launcher, so tools that identify processes by
  # executable see gallery-dl-flatpak, and that refuses download folders the
  # sandbox can't keep.
  - name: launcher
    buildsystem: simple
    build-commands:
      - install -Dm755 /usr/bin/python3 "${FLATPAK_DEST}/bin/gallery-dl-flatpak"
      - install -Dm755 gallery-dl -t "${FLATPAK_DEST}/bin"
      - install -Dm644 gallery_dl_flatpak.py -t "${FLATPAK_DEST}/lib/python3.14/site-packages"
      - python3 -m compileall -q "${FLATPAK_DEST}/lib/python3.14/site-packages/gallery_dl_flatpak.py"
    sources:
      - type: file
        path: launcher/gallery-dl
      - type: file
        path: launcher/gallery_dl_flatpak.py

  # The add-ons' Python packages, generated by scripts/generate-python-deps.py.
  - addons/python3-yt-dlp.json
  - addons/python3-pysocks.json
  - addons/python3-brotli.json
  - addons/python3-pyyaml.json
  - addons/python3-secretstorage.json

  # Site credentials from the desktop keyring, part of the SecretStorage
  # add-on. Python imports usercustomize from its site-packages at startup.
  - name: secretstorage-keyring
    buildsystem: simple
    build-commands:
      - install -Dm644 gallery_dl_keyring.py usercustomize.py -t "${FLATPAK_DEST}/extensions/secretstorage/lib/python3.14/site-packages"
      - python3 -m compileall -q -l "${FLATPAK_DEST}/extensions/secretstorage/lib/python3.14/site-packages"
      - install -Dm755 gallery-dl-keyring -t "${FLATPAK_DEST}/extensions/secretstorage/bin"
    sources:
      - type: file
        path: addons/keyring/gallery_dl_keyring.py
      - type: file
        path: addons/keyring/usercustomize.py
      - type: file
        path: addons/keyring/gallery-dl-keyring

  - addons/python3-psycopg.json
  - addons/python3-truststore.json
  - addons/python3-jinja.json

  # mkvmerge and its private libraries from the official AppImage, extracted
  # without FUSE. The source archive provides the license and README.
  - name: mkvmerge
    buildsystem: simple
    build-commands:
      - chmod +x mkvtoolnix.AppImage
      - ./mkvtoolnix.AppImage --appimage-extract > /dev/null
      - python3 package-mkvmerge.py squashfs-root "${FLATPAK_DEST}/extensions/mkvmerge"
      - install -Dm644 COPYING README.md -t "${FLATPAK_DEST}/extensions/mkvmerge/share/doc/mkvmerge"
    sources:
      - type: file
        url: https://mkvtoolnix.download/appimage/MKVToolNix_GUI-102.0-x86_64.AppImage
        dest-filename: mkvtoolnix.AppImage
        sha256: c66345b30d6d5fd640ea982ab5e202a99b9f541a20e42aa19edd90f3ddd5dc9b
        x-checker-data:
          type: html
          url: https://mkvtoolnix.download/appimage/
          version-pattern: MKVToolNix_GUI-([\d.]+)-x86_64\.AppImage
          url-template: https://mkvtoolnix.download/appimage/MKVToolNix_GUI-$version-x86_64.AppImage
      - type: archive
        url: https://mkvtoolnix.download/sources/mkvtoolnix-102.0.tar.xz
        sha256: 9f0a810f17c7df8adb9064a3a41d5784399be412d19704cf080745ad7d45da30
        x-checker-data:
          type: html
          url: https://mkvtoolnix.download/sources/
          version-pattern: mkvtoolnix-([\d.]+)\.tar\.xz
          url-template: https://mkvtoolnix.download/sources/mkvtoolnix-$version.tar.xz
      - type: file
        path: addons/package-mkvmerge.py

  - name: metadata
    buildsystem: simple
    build-commands:
      - install -Dm644 eu.nosini.GalleryDl.metainfo.xml -t "${FLATPAK_DEST}/share/metainfo"
      - install -Dm644 eu.nosini.GalleryDl.desktop -t "${FLATPAK_DEST}/share/applications"
      - install -Dm644 eu.nosini.GalleryDl.svg -t "${FLATPAK_DEST}/share/icons/hicolor/scalable/apps"
      - install -Dm755 gallery-dl-terminal -t "${FLATPAK_DEST}/bin"
      # Metainfo and software-catalog entries of the add-ons.
      - python3 install-metadata.py
    sources:
      - type: file
        path: eu.nosini.GalleryDl.metainfo.xml
      - type: file
        path: eu.nosini.GalleryDl.desktop
      - type: file
        path: eu.nosini.GalleryDl.svg
      - type: file
        path: launcher/gallery-dl-terminal
      - type: file
        path: addons/addons.json
      - type: file
        path: addons/install-metadata.py
