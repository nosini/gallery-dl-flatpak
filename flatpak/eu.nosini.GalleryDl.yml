id: eu.nosini.GalleryDl
branch: stable
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: gallery-dl
build-options:
  no-debuginfo: true
finish-args:
  - --share=network
  - --filesystem=xdg-config/gallery-dl:create
  - --filesystem=~/.gallery-dl.conf:ro
  - --env=BROWSER=xdg-open
  - --env=PYTHONPATH=/app/extensions/yt-dlp/lib/python3.14/site-packages:/app/extensions/pysocks/lib/python3.14/site-packages:/app/extensions/brotli/lib/python3.14/site-packages:/app/extensions/pyyaml/lib/python3.14/site-packages:/app/extensions/secretstorage/lib/python3.14/site-packages:/app/extensions/psycopg/lib/python3.14/site-packages:/app/extensions/truststore/lib/python3.14/site-packages:/app/extensions/jinja/lib/python3.14/site-packages
  - --env=PATH=/app/extensions/yt-dlp/bin:/app/extensions/mkvmerge/bin:/app/extensions/secretstorage/bin:/app/bin:/usr/bin
add-extensions:
  eu.nosini.GalleryDl.YtDlp:
    directory: extensions/yt-dlp
    version: stable
    bundle: true
    no-autodownload: true
    autodelete: true
  eu.nosini.GalleryDl.PySocks:
    directory: extensions/pysocks
    version: stable
    bundle: true
    no-autodownload: true
    autodelete: true
  eu.nosini.GalleryDl.Brotli:
    directory: extensions/brotli
    version: stable
    bundle: true
    no-autodownload: true
    autodelete: true
  eu.nosini.GalleryDl.PyYAML:
    directory: extensions/pyyaml
    version: stable
    bundle: true
    no-autodownload: true
    autodelete: true
  eu.nosini.GalleryDl.SecretStorage:
    directory: extensions/secretstorage
    version: stable
    bundle: true
    no-autodownload: true
    autodelete: true
  eu.nosini.GalleryDl.Psycopg:
    directory: extensions/psycopg
    version: stable
    bundle: true
    no-autodownload: true
    autodelete: true
  eu.nosini.GalleryDl.Truststore:
    directory: extensions/truststore
    version: stable
    bundle: true
    no-autodownload: true
    autodelete: true
  eu.nosini.GalleryDl.Jinja:
    directory: extensions/jinja
    version: stable
    bundle: true
    no-autodownload: true
    autodelete: true
  eu.nosini.GalleryDl.MkvMerge:
    directory: extensions/mkvmerge
    version: stable
    bundle: true
    no-autodownload: true
    autodelete: true
modules:
  - python-packages.json
  - yt-dlp-packages.json
  - pysocks-packages.json
  - brotli-packages.json
  - pyyaml-packages.json
  - secretstorage-packages.json
  - name: secretstorage-keyring
    buildsystem: simple
    build-commands:
      - install -Dm644 -t "${FLATPAK_DEST}/extensions/secretstorage/lib/python3.14/site-packages" gallery_dl_keyring.py usercustomize.py
      - python3 -m compileall -q -l "${FLATPAK_DEST}/extensions/secretstorage/lib/python3.14/site-packages"
      - install -Dm755 gallery-dl-keyring "${FLATPAK_DEST}/extensions/secretstorage/bin/gallery-dl-keyring"
    sources:
      - type: file
        path: keyring/gallery_dl_keyring.py
      - type: file
        path: keyring/usercustomize.py
      - type: file
        path: keyring/gallery-dl-keyring
  - psycopg-packages.json
  - truststore-packages.json
  - jinja-packages.json
  - mkvmerge.json
  - name: metadata
    buildsystem: simple
    build-commands:
      - install -Dm644 eu.nosini.GalleryDl.metainfo.xml /app/share/metainfo/eu.nosini.GalleryDl.metainfo.xml
      - install -Dm644 eu.nosini.GalleryDl.desktop /app/share/applications/eu.nosini.GalleryDl.desktop
      - install -Dm644 eu.nosini.GalleryDl.svg /app/share/icons/hicolor/scalable/apps/eu.nosini.GalleryDl.svg
      - install -Dm755 gallery-dl-terminal /app/bin/gallery-dl-terminal
      - python3 install-addon-metadata.py
    sources:
      - type: file
        path: eu.nosini.GalleryDl.metainfo.xml
      - type: file
        path: eu.nosini.GalleryDl.desktop
      - type: file
        path: eu.nosini.GalleryDl.svg
      - type: file
        path: gallery-dl-terminal
      - type: file
        path: addons.json
      - type: file
        path: ../scripts/install-addon-metadata.py
